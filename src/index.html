<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('css') ?>
</head>
<body>
  <header class="topbar">
    <div class="title">SVレポート登録 <span id="version" class="muted"></span></div>
    <div class="status">
      <span id="netStatus" class="badge"></span>
      <span id="draftStatus" class="muted"></span>
    </div>
  </header>

  <div id="pendingBanner" class="banner hidden">
    未送信の登録が <b id="pendingCount">0</b> 件あります（<span id="pendingNames"></span>）。オンラインに戻ると自動で送信します。
    <button id="sendPending" class="secondary">今すぐ送信</button>
  </div>
  <div id="banner" class="banner hidden"></div>

  <main>
    <section class="card" id="headerCard">
      <div class="grid">
        <label class="span2">校舎
          <input id="school" list="schoolList" placeholder="校舎ID または 校舎名で検索" autocomplete="off">
          <datalist id="schoolList"></datalist>
        </label>
        <label>実施日 <input id="date" type="date"></label>
        <div class="period"><span class="muted">実施回</span><div id="period">-</div></div>
        <label>AM <input id="am" list="amList" autocomplete="off"><datalist id="amList"></datalist></label>
        <label>SV <input id="sv" list="svList" autocomplete="off"><datalist id="svList"></datalist></label>
        <label>現金 <input id="cash" type="number" inputmode="numeric"></label>
        <label>通帳残 <input id="bank" type="number" inputmode="numeric"></label>
        <div class="period"><span class="muted">合計</span><div id="cashTotal">-</div></div>
        <label>TMS金額 <input id="tms" type="number" inputmode="numeric"></label>
      </div>
      <div id="contextInfo" class="context muted"></div>
    </section>

    <section class="card hidden" id="itemsCard">
      <div class="legend muted">
        前回・前々回は倍率適用後の減点。連続指摘は 2回目×2／3回目×3／4回目以降×4（レベルが違っても連続）。
        <label class="inline"><input type="checkbox" id="onlyPrev"> 前回・前々回の指摘項目のみ表示</label>
      </div>
      <table class="items">
        <thead>
          <tr>
            <th class="c-no">No</th><th>項目</th><th class="c-hist">前々回</th><th class="c-hist">前回</th>
            <th class="c-level">今回</th><th class="c-na">対象外</th><th class="c-applied">減点</th>
            <th class="c-note">備考</th><th class="c-photo">写真</th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <div class="general-photo">
        <span>全体写真</span>
        <input type="file" accept="image/*" multiple data-photo-key="">
        <div class="thumbs" data-thumbs-key=""></div>
      </div>
    </section>
  </main>

  <footer class="bottombar hidden" id="bottombar">
    <div class="scores">
      <div>前々回 <b id="scorePrev2">-</b></div>
      <div>前回 <b id="scorePrev">-</b></div>
      <div>今回 <b id="scoreNow" class="big">100</b> <span class="muted">（減点 <span id="totalNow">0</span>）</span></div>
    </div>
    <div class="actions">
      <button id="clearDraft" class="secondary">下書きを破棄</button>
      <button id="submit" class="primary">登録</button>
    </div>
  </footer>

  <div id="done" class="modal hidden">
    <div class="modal-body">
      <h2>登録しました</h2>
      <p id="doneText"></p>
      <p><a id="doneLink" target="_blank" rel="noopener">レポートを開く</a></p>
      <button id="doneNext" class="primary">続けて入力する</button>
    </div>
  </div>

  <div id="loading" class="loading hidden"><div class="spinner"></div><div id="loadingText">処理中…</div></div>

  <script>
<?!= sharedSource() ?>
  </script>
  <?!= include('js') ?>
</body>
</html>
